version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  build:
    desc: Build the binary into bin/
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/kubegrade ./cmd/kubegrade

  run:
    desc: Single scan against the current kubeconfig context
    cmds:
      - go run ./cmd/kubegrade {{.CLI_ARGS}}

  refresh-data:
    desc: Refresh built-in EOL tables and Pluto deprecations
    cmds:
      - ./hack/refresh-data.sh

  demo:
    desc: Render a sample report in colour, for screenshots
    cmds:
      - go run ./hack/demo
