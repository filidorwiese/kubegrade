apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubegrade-agent
  namespace: kubegrade
  labels:
    app: kubegrade-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubegrade-agent
  template:
    metadata:
      labels:
        app: kubegrade-agent
    spec:
      serviceAccountName: kubegrade-agent
      imagePullSecrets:
        - name: ghcr-token
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/filidorwiese/kubegrade-agent:latest
          imagePullPolicy: Always
          args:
            - --interval=15m
            - --cluster-name=k3s-home
            - --online
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
